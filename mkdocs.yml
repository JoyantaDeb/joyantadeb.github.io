site_name: Joyanta Debnath | Academic Portfolio
site_description: M.Tech Remote Sensing | Civil Engineering | Water Resources
site_url: https://joyantadeb.github.io

theme:
  name: material
  custom_dir: overrides
  palette:
    - scheme: light
      primary: custom
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: dark
      primary: custom
      accent: light-blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  
  font:
    text: Segoe UI
    code: Roboto Mono
  
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - search.suggest
    - content.code.copy
    - header.autohide

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - pymdownx.emoji
  - pymdownx.superfences
  - tables
  - toc

nav:
  - Home: index.md
  - Research:
    - Water Quality Assessment: feni_river.md
    - Varuna WQI System: varuna.md
    - Aerobic Composting: composting.md
  - About: 
    - CV: cv.md
  - Contact: contact.md