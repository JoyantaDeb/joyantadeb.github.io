site_name: Joyanta Debnath | Portfolio
site_description: M.Tech Remote Sensing | Civil Engineering | Water Resources
site_url: https://joyantadeb.github.io

theme:
  name: material
  palette:
    - scheme: light
      primary: custom
      accent: cyan
  
  font:
    text: Segoe UI
    code: Roboto Mono
  
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - search.suggest
    - content.code.copy
    - header.autohide

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - pymdownx.emoji
  - pymdownx.superfences
  - tables

nav:
  - Home: index.md
  - Research:
    - Water Quality: feni_river.md
    - Varuna System: varuna.md
    - Composting Study: composting.md
  - Contact: contact.md