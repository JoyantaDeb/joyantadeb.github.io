site_name: Joyanta Debnath | Portfolio
site_description: M.Tech Remote Sensing | Civil Engineering | Water Resources
site_url: https://joyantadeb.github.io

docs_dir: docs_source
site_dir: site

theme:
  name: material
  palette:
    - scheme: light
      primary: blue
      accent: cyan
  font:
    text: Segoe UI
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - search.suggest

extra_css:
  - css/extra.css

markdown_extensions:
  - pymdownx.emoji
  - tables
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Research:
      - Water Quality: feni_river.md
      - Varuna System: varuna.md
      - Composting Study: composting.md
  - Projects: projects.md
  - Training: training.md
  - Awards: awards.md
  - Contact: contact.md
